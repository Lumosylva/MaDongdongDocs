# Waline 评论后端 Nginx 反代配置（子域名 comment.madongdong.com）
# 部署到 /etc/nginx/sites-available/comment.madongdong.com，
# 再软链到 /etc/nginx/sites-enabled/，nginx -t 通过后 reload。
# 证书复用现有泛域名证书 *.madongdong.com。

server {
    listen 80;
    listen [::]:80;
    server_name comment.madongdong.com;
    return 301 https://comment.madongdong.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name comment.madongdong.com;

    ssl_certificate     /etc/letsencrypt/live/madongdong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madongdong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8360;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header REMOTE-HOST        $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-cache";
    }
}
