# 文档站静态站点 Nginx 配置（子域名 docs.madongdong.com）
# 部署到 /etc/nginx/sites-available/docs.madongdong.com，
# 再软链到 /etc/nginx/sites-enabled/，nginx -t 通过后 reload。
# 证书复用现有泛域名证书 *.madongdong.com。
# 产物由本地 `npm run docs:build` 生成，解压到 root 目录；服务器不跑 Node。

server {
    listen 80;
    listen [::]:80;
    server_name docs.madongdong.com;
    return 301 https://docs.madongdong.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.madongdong.com;

    ssl_certificate     /etc/letsencrypt/live/madongdong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madongdong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/docs;
    index index.html index.htm;

    # 静态资源长缓存（带内容哈希的 JS/CSS/图片）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1k;
}
